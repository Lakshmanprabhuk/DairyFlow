<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DairyFlow</title>
<meta name="theme-color" content="#1F3741">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DairyFlow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: DairyTop's own: practical, friendly, calm; the work comes first.
   IDEA: the field adviser's daily clipboard: who to visit, call, chase and bill, on one map of the farms.
   PICTURE: a navy night map with sky-blue columns per farm; the clipboard lists beside and below it.
   COLOUR and TYPE: dairytop.eu: navy #1F3741 bars, sky #40BCF3 for action, grey-blue #EEF2F3 ground, white cards; Outfit headings, DM Sans text.
   LAYOUT: who are you → your modules → one module at a time under a navy app bar. */
:root{color-scheme:light dark;--bg:light-dark(#EEF2F3,#0F1C22);--card:light-dark(#FFFFFF,#162730);--ink:light-dark(#1F3741,#E4EDF0);--mute:light-dark(#5E6F77,#94A8B0);--line:light-dark(#DCE5E9,#243841);--soft:light-dark(#E3F3FB,#17323F);--navy:#1F3741;--sky:#40BCF3;--skyd:#0A7FB5;--green:#2E9B62;--amber:#E5A93D;--red:#D95C5C;--orange:#E07B39;--grey:#8A9AA1}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
h1,h2,h3,.brand{font-family:Outfit,'DM Sans',sans-serif;letter-spacing:-.01em}
h1{font-size:clamp(28px,3.4vw,42px);line-height:1.06;margin:0 0 8px;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0 0 4px}h3{font-size:17px;margin:0 0 4px}
.sub{color:var(--mute);margin:0;max-width:76ch}
button{font:inherit}
.btn{background:var(--sky);color:#0D2733;border:0;border-radius:5px;font-weight:700;padding:10px 16px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13.5px}
.btn:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(18px,3vw,36px) max(3vw,16px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(31,55,65,.06)}
/* who */
#who{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#1F3741 0 46%,var(--bg) 46%)}
.login{width:min(860px,100%);padding:clamp(22px,4vw,40px);position:relative}
.login .logo{position:absolute;top:26px;right:26px;width:64px;height:64px;border-radius:12px;background:#fff}
.eyebrow{color:var(--sky);font-weight:700;margin:0 0 6px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:22px}
.person{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:inherit;min-height:64px}
.person:hover,.person:focus-visible{border-color:var(--sky);outline:none}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--skyd);font:700 15px Outfit,sans-serif;flex:none}
.person .r{font-size:13px;color:var(--mute)}
.powered{margin-top:22px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.powered b{color:var(--ink)}
/* app bar */
.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.bar .in{max-width:1320px;margin:0 auto;padding:10px max(3vw,16px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar img{width:38px;height:38px;border-radius:8px;background:#fff}
.bar .brand{font-size:21px;font-weight:700;cursor:pointer}.bar .brand span{color:var(--sky)}
.mods{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:thin}
.mods button{flex:none;background:none;border:0;color:#BFD3DB;padding:9px 11px;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:500;font-size:14.5px;min-height:40px}
.mods button.on{background:rgba(64,188,243,.18);color:#fff}
.me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:22px;padding:4px 12px 4px 4px;cursor:pointer;min-height:40px}
.me .av{width:32px;height:32px;font-size:12px;background:var(--sky);color:#0D2733}
/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px;margin-top:22px}
.tile{text-align:left;padding:18px;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:170px}
.tile:hover,.tile:focus-visible{border-color:var(--sky);outline:none;box-shadow:0 4px 14px rgba(31,55,65,.1)}
.tile svg{width:30px;height:30px;color:var(--skyd)}
.tile .fig{font:700 22px Outfit,sans-serif;margin-top:auto}
.tile .lock{font-size:12.5px;color:var(--mute)}
/* module chrome */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.kpi{padding:14px 16px}.kpi .l{font-size:13.5px;color:var(--mute);font-weight:500}.kpi .v{font:700 clamp(22px,2.3vw,30px)/1.2 Outfit,sans-serif;margin:4px 0 2px}.kpi .s{font-size:13.5px;color:var(--mute)}
.panel{padding:18px clamp(14px,2vw,22px);margin-top:16px}
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=search],input[list],input[type=password],input[type=text],input[inputmode]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:16px 'DM Sans',sans-serif;min-height:44px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
tr.grp td{background:var(--soft);font-weight:700}
a.cl{color:var(--skyd);font-weight:700;cursor:pointer;text-decoration:none}a.cl:hover{text-decoration:underline}
:root[data-theme=dark] a.cl{color:var(--sky)}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) a.cl{color:var(--sky)}}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.t-red{background:rgba(217,92,92,.14);color:#B33A3A}.t-amb{background:rgba(229,169,61,.18);color:#8F620E}.t-or{background:rgba(224,123,57,.16);color:#A44E17}.t-gr{background:rgba(46,155,98,.15);color:#1C7A46}.t-g{background:rgba(138,154,161,.2);color:var(--mute)}.t-sky{background:var(--soft);color:var(--skyd)}
.oc{display:flex;gap:4px}.oc button{border:1px solid var(--line);background:none;color:var(--mute);border-radius:5px;font-size:12.5px;font-weight:700;padding:6px 8px;cursor:pointer;min-height:32px}
.oc button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{font-size:13.5px;color:var(--mute);margin:10px 0 0}
.empty{color:var(--mute);padding:16px 0}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.fig2{position:relative;min-height:300px}.fig2>svg{position:absolute;inset:0;width:100%;height:100%}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rows .bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.rows .bar i{display:block;height:100%;background:var(--sky);border-radius:3px}
.alert{border-left:4px solid var(--red);background:light-dark(#FDF3F3,#2A1A1C);padding:10px 14px;border-radius:6px;margin:8px 0;font-size:15px}
.alert.a{border-color:var(--amber);background:light-dark(#FFF8EA,#2A2416)}.alert.o{border-color:var(--orange);background:light-dark(#FFF4EC,#2A1F17)}.alert.g{border-color:var(--green);background:light-dark(#EFF8F3,#15281F)}.alert.s{border-color:var(--sky);background:var(--soft)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:14.5px}.kv span{color:var(--mute)}.kv b{text-align:right;font-weight:700;white-space:nowrap}
/* map */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;background:#0B171D;border-radius:10px;overflow:hidden;border:1px solid #1E323B;min-height:600px}
.mapwrap{position:relative;min-height:600px;touch-action:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
.ctrl{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;z-index:3;max-width:calc(100% - 70px)}
.seg{display:inline-flex;background:rgba(16,32,40,.9);border:1px solid #2A4350;border-radius:7px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.zoom button{background:none;border:0;color:#CFE3EC;font-weight:700;font-size:13px;padding:8px 11px;border-radius:5px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--sky);color:#0D2733}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoom button{background:rgba(16,32,40,.9);border:1px solid #2A4350;width:40px;height:40px;padding:0;font-size:17px}
.legend{position:absolute;left:12px;bottom:12px;z-index:3;background:rgba(16,32,40,.9);border:1px solid #2A4350;border-radius:7px;padding:9px 12px;color:#CFE3EC;font-size:12.5px;max-width:300px}
.attr{position:absolute;right:12px;bottom:10px;color:#6F8791;font-size:11px;z-index:3}
.side{background:#112029;color:#DFEAEE;border-left:1px solid #1E323B;display:flex;flex-direction:column;max-height:700px}
.side .tabs{display:flex;border-bottom:1px solid #22384A}
.side .tabs button{flex:1;background:none;border:0;color:#9FB6C0;font-weight:700;font-size:13.5px;padding:12px 6px;cursor:pointer;border-bottom:2px solid transparent;min-height:44px}
.side .tabs button.on{color:#fff;border-bottom-color:var(--sky)}
.side .pane{padding:14px 16px;overflow:auto;flex:1}
.side h3{color:#fff}.side .m{color:#93A6AE;font-size:13.5px}
.side select,.side input{width:100%;background:#0B171D;color:#E6EEF1;border-color:#2A4350}
.rb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid #1E323B;cursor:pointer;font-size:14px}
.rb:hover .nm{color:var(--sky)}.rb .bar{grid-column:1/-1;height:5px;background:#1E323B;border-radius:3px;overflow:hidden}.rb .bar i{display:block;height:100%;border-radius:3px}
.stop{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1E323B;font-size:14px}
.stop input{width:18px;height:18px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sky);color:#0D2733;font-weight:700;font-size:12px}
#tip{position:fixed;pointer-events:none;background:rgba(10,22,28,.96);color:#fff;border:1px solid #2A4350;border-radius:6px;padding:8px 10px;font-size:13.5px;z-index:60;display:none;max-width:290px;line-height:1.4}
#tip .m{color:#9FB6C0}
dialog{border:0;border-radius:10px;padding:0;max-width:720px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,15,20,.6)}
.dlg{padding:18px 20px}.dlg textarea{width:100%;min-height:300px;font:14px/1.5 'DM Sans',sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
#install{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;width:min(560px,calc(100% - 24px));background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;display:none;gap:12px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#install img{width:44px;height:44px;border-radius:10px;background:#fff;flex:none}#install p{margin:0;font-size:14.5px;flex:1}#install b{font-family:Outfit,sans-serif;font-size:16px}
.ca{display:inline-flex;gap:6px;flex-wrap:wrap}.ca a{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;font-weight:700;color:var(--skyd);text-decoration:none;min-height:34px;background:var(--card)}
.ca a:hover{border-color:var(--sky)}.ca a svg{width:15px;height:15px}.side .ca a{background:#0B171D;border-color:#2A4350;color:#9BE0FF}
footer{color:var(--mute);font-size:13px;text-align:center;padding:22px}footer b{color:var(--ink)}
#err{display:none;background:#fff3f3;color:#8a1f1f;padding:14px;border-radius:8px;margin:12px}
@media(max-width:1000px){.stage{grid-template-columns:minmax(0,1fr)}.side{max-height:none;border-left:0;border-top:1px solid #1E323B}.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.bar .in{gap:8px 10px;padding-bottom:4px}.me{margin-left:auto}
 .mods{order:3;flex:1 0 100%;margin:0 calc(-1 * max(3vw,16px));padding:0 max(3vw,16px) 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 32px),transparent)}
 .mods::-webkit-scrollbar{display:none}.mods button{padding:8px 12px}}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px 13px}.kpi .v{font-size:21px}.kpi .l,.kpi .s{font-size:12.5px}}
@media(max-width:380px){.me .nm{display:none}.me{padding-right:4px}.bar .brand{font-size:19px}}
@media(max-width:700px){.bar{position:static}.mapwrap{min-height:470px}.legend{display:none}.login .logo{width:48px;height:48px;top:18px;right:18px}}
@media(max-width:600px){table{font-size:13.5px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:9em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8.5em;margin-inline-start:-9em;color:var(--mute);font-size:12.5px;white-space:normal}.stack td:empty{display:none}.stack td.n{text-align:start}.stack tfoot td{padding-inline-start:0}}
#ldr{text-align:center;padding:8px 0 4px}#ldr .cow{width:64px;height:64px;border-radius:16px;animation:ldrP 1.6s ease-in-out infinite}
#ldr h1{margin:16px 0 4px}#ldr .trk{height:4px;border-radius:4px;background:#E3ECF0;overflow:hidden;max-width:320px;margin:18px auto 0}
#ldr .trk i{display:block;height:100%;width:38%;border-radius:4px;background:var(--sky);animation:ldrB 1.25s ease-in-out infinite}
#ldr .th{min-height:46px;max-width:420px;margin:18px auto 0;color:var(--muted,#5B6B72);font-size:14.5px;line-height:1.45;transition:opacity .35s}
#ldr .th small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);margin-bottom:3px;font-weight:700}
@keyframes ldrP{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes ldrB{0%{transform:translateX(-110%)}100%{transform:translateX(290%)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F3741;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:60;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}#ldr .cow,#ldr .trk i{animation:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0]?.cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div id="err"></div>
<div id="root"><div class="wrap"><p class="sub">Loading DairyFlow…</p></div></div>
<div id="tip"></div>
<div id="install" role="dialog" aria-label="Install DairyFlow"><img src="icons/icon-192.png" alt=""><p><b>Install DairyFlow</b><br><span id="instTxt">Add it to your home screen: it opens like an app and works offline.</span></p><button class="btn" id="instGo">Install</button><button class="btn ghost" id="instNo" style="color:#fff">Not now</button></div>
<dialog id="dlg"><div class="dlg"><div class="lh"><h2 id="dlgT">Reminder</h2><div class="seg" id="langSeg" style="background:var(--navy)"><button data-l="de">Deutsch</button><button data-l="nl">Nederlands</button><button data-l="en">English</button></div></div>
<textarea id="dlgX" aria-label="Text"></textarea>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap"><span class="note" id="dlgN" style="margin:0 auto 0 0"></span><span class="ca" id="dlgSend"></span><button class="btn" id="dlgC">Copy text</button><button class="btn ghost" id="dlgClose">Close</button></div></div></dialog>
<script>
{
/* ================= helpers ================= */
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('de-DE'),NF1=new Intl.NumberFormat('de-DE',{maximumFractionDigits:1}),NF2=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=c=>(c<0?'−':'')+'€ '+NF.format(Math.abs(Math.round(c/100))), eur2=c=>(c<0?'−':'')+'€ '+NF2.format(Math.abs(c)/100);
const eurS=c=>{const v=Math.abs(c/100),s=c<0?'−':'';return v>=1e6?s+'€ '+(v/1e6).toLocaleString('de-DE',{maximumFractionDigits:2})+'M':v>=1e4?s+'€ '+Math.round(v/1e3)+'K':s+'€ '+NF.format(Math.round(v))};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dl=iso=>{if(!iso)return'—';const [y,m,d]=iso.split('-');return d?`${+d} ${MN[m-1]} ${y}`:`${MN[m-1]} ${y}`};
const sinceTxt=fs=>!fs?'—':fs.length===7&&fs===D.meta.months[0]?dl(fs)+' or earlier':dl(fs);
const ordWhat=L=>{const it=[...new Set(L.flatMap(x=>x.items||[]))],v=sum(L,x=>x.val),un=L.filter(x=>!x.val).length;return (v?eur2(v)+(un?`, plus ${un} without a price`:''):'no price on the order')+(it.length?': '+it.slice(0,4).join(', ')+(it.length>4?'…':''):'')};
const win12=()=>{const M=D.meta.months,a=M[Math.max(0,M.length-12)],b=M[M.length-1];return `${dl(a)} – ${dl(D.meta.lt)}`};
const DAY=864e5,tOf=iso=>Math.round(Date.parse(iso+'T00:00:00Z')/DAY),isoT=t=>new Date(t*DAY).toISOString().slice(0,10);
const ton=kg=>NF1.format(kg/1000)+' t';
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const LOGO='icons/icon-192.png';
const API='__DAIRYFLOW_API__',LIVE=!API.startsWith('__');
const api=(body)=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json());

/* ================= people, access, modules ================= */

const C={

 cash(){const lt=tOf(D.meta.lt),wk=Array.from({length:8},(_,k)=>({k,a:lt+1+7*k,b:lt+7*(k+1),inv:0,ord:0,rows:[]})),later={inv:0,ord:0,rows:[]},beyond={amt:0,rows:[]},credits={amt:0,rows:[]};let total=0;
  const put=(t,amt,row,kind)=>{const w=wk.find(w=>t>=w.a&&t<=w.b);const B=w||(t>wk[7].b?later:wk[0]);B[kind]+=amt;B.rows.push(row)};
  for(const co of D.collections){if(!inS(co.c))continue;const L=C.lateDays(co.c);
   for(const x of co.inv){total+=x.incl;if(x.incl<0){credits.amt+=x.incl;credits.rows.push({c:co.c,no:x.no,amt:x.incl});continue}
    const exp=tOf(x.due)+Math.round(L),row={c:co.c,no:x.no,amt:x.incl,due:x.due,exp:isoT(Math.max(exp,lt+1)),kind:'Invoice'};
    if(exp<=lt&&x.late>0){beyond.amt+=x.incl;beyond.rows.push(row)}else put(Math.max(exp,lt+1),x.incl,row,'inv')}}
  let ordTot=0;for(const o of D.orders){if(!inS(o.c)||!o.val||(o.stage!=='deliveredNotInvoiced'&&o.stage!=='toDeliver'))continue;
   const inv=o.stage==='deliveredNotInvoiced'?lt+7:Math.max(tOf(o.due),lt)+7,terms=D.terms[o.c]??14,exp=inv+terms+Math.round(C.lateDays(o.c)),amt=Math.round(o.val*C.vat(o.c));ordTot+=amt;
   put(Math.max(exp,lt+1),amt,{c:o.c,no:o.no,amt,exp:isoT(Math.max(exp,lt+1)),kind:'Order'},'ord')}
  return{wk,later,beyond,credits,total,ordTot}},
 price(){const lt=tOf(D.meta.lt),M=D.meta.months,byM=new Map(),byP=new Map(),low=new Map();
  for(const r of D.margin){const [m,d,c,p,rev,kg,cost]=r;const x=byM.get(m)||{rev:0,cost:0,kg:0};x.rev+=rev;x.cost+=cost;x.kg+=kg;byM.set(m,x);
   const y=byP.get(p)||{rev:0,cost:0,kg:0,m:new Map()};y.rev+=rev;y.cost+=cost;y.kg+=kg;const z=y.m.get(m)||{rev:0,kg:0,cost:0};z.rev+=rev;z.kg+=kg;z.cost+=cost;y.m.set(m,z);byP.set(p,y);
   const t=tOf(M[m]+'-'+String(d).padStart(2,'0'));if(t>=lt-90&&inS(c)){const k=c+'|'+p,w=low.get(k)||{c,p,rev:0,cost:0,kg:0,last:0};w.rev+=rev;w.cost+=cost;w.kg+=kg;w.last=Math.max(w.last,t);low.set(k,w)}}
  const alerts=[...low.values()].filter(w=>w.rev>0&&(w.rev-w.cost)/w.rev<.05).sort((a,b)=>(a.rev-a.cost)-(b.rev-b.cost));
  const spread=[];for(const [p,t] of prodTot){if(!D.products[p][1]||t.kg<1000||t.rev<=0)continue;const avg=t.rev/t.kg;
   for(const [c,L] of cpBy){if(!inS(c))continue;const x=L.find(x=>x.p===p);if(!x||x.kg<500||x.rev<=0)continue;const pr=x.rev/x.kg;if(pr<avg*.9)spread.push({c,p,kg:x.kg,price:pr,avg,gap:Math.round((avg-pr)*x.kg)})}}

   return{chg,p:x.p,rev:x.rev,kg:x.kg,q:x.q/qs,kgP,mine,avg,diff:mine&&avg?(mine/avg-1)*100:null,last:x.last||null,od:x.n}});

/* ================= CRM (added) =================
   Visit notes, follow-up tasks and prospects. The server decides who may read and write (see apps-script/Code.gs);
   this part only keeps a copy on the device, queues changes while offline and shows them.
   Customers are addressed by their Microfas id (D.ref[position]); prospects as 'p:<id>'. */
const CRMT={visit:'Visit',call:'Call',email:'Email',note:'Note'};
const CRMO={'':'No outcome',spoke:'Spoke to them',noanswer:'No answer',order:'Order placed',quote:'Quote requested',followup:'Follow-up needed',notinterested:'Not interested',other:'Other'};
const CRMS={new:'New',contacted:'Contacted',interested:'Interested',quote:'Quote sent',won:'Won',lost:'Lost'};
const CRMCC={NL:'Netherlands',DE:'Germany',BE:'Belgium',AT:'Austria',CH:'Switzerland',DK:'Denmark',FR:'France',LU:'Luxembourg',PL:'Poland',CZ:'Czechia',HU:'Hungary',ES:'Spain',GB:'United Kingdom',IE:'Ireland',SE:'Sweden',SK:'Slovakia',RO:'Romania'};
const CRM={forD:null,state:'',err:'',ci:new Map(),A:new Map(),T:new Map(),P:new Map(),out:[],since:'',fullAt:0,busy:false,tok:'',me:null,last:0,again:false,tw:'',tab:'today',aF:{type:'',who:'',q:'',all:false}};
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const crmId=()=>{try{return crypto.randomUUID()}catch{return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,12)}};
const ownerOf=ci=>D.vkOfCust[ci]||'',isChan=o=>!o||CHANNELS.includes(o);
const canWriteC=ci=>ci!=null&&(isChan(ownerOf(ci))?ADMIN:ownerOf(ci)===ME);
const crmPros=ref=>String(ref).startsWith('p:')?CRM.P.get(String(ref).slice(2)):null;
const canWriteRef=ref=>{const p=crmPros(ref);return String(ref).startsWith('p:')?!!p&&!p.linked&&p.owner===ME:canWriteC(CRM.ci.get(ref))};
const refName=ref=>{const p=crmPros(ref);if(String(ref).startsWith('p:'))return p?p.name:'Prospect';const i=CRM.ci.get(ref);return i==null?'Customer':D.names[i]||'Customer'};
const refLink=ref=>{const i=CRM.ci.get(ref);return String(ref).startsWith('p:')?`<a class="cl" data-p="${esc(String(ref).slice(2))}">${esc(refName(ref))}</a> <span class="tag t-sky">Prospect</span>`:i!=null&&byI.get(i)?cn(i):esc(refName(ref))};
const cA=()=>[...CRM.A.values()],cT=()=>[...CRM.T.values()],cP=()=>[...CRM.P.values()];
const actsOf=ref=>cA().filter(a=>a.ref===ref).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));
const tasksOf=ref=>cT().filter(t=>t.ref===ref&&t.status==='open').sort((a,b)=>a.due.localeCompare(b.due));
const crmReady=()=>CRM.state==='ready'||CRM.state==='offline';
const crmDue=()=>{const t=todayISO();return cT().filter(x=>x.status==='open'&&x.owner===ME&&x.due<=t).length};
const dueTag=due=>{const t=todayISO();return due<t?`<span class="tag t-red">${NF.format(tOf(t)-tOf(due))} d overdue</span>`:due===t?'<span class="tag t-amb">Today</span>':`<span class="tag t-g">${dl(due)}</span>`};
const crmSty=()=>{if(document.getElementById('crmCss'))return;const s=document.createElement('style');s.id='crmCss';s.textContent=`.crm-f{display:grid;gap:12px;margin-top:10px}.crm-f label{display:grid;gap:4px;font-weight:600;font-size:14px}

.crm-f textarea{min-height:110px;resize:vertical}.crm-f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.crm-f .chk{display:flex;gap:8px;align-items:center;font-weight:500}.crm-f .chk input{width:auto;min-height:0}
.crm-f .hint{font-size:13px;color:var(--mute);margin:0}.crm-act{display:flex;gap:6px;flex-wrap:wrap}.crm-tl{display:grid;gap:10px;margin-top:10px}.crm-tl .it{border-left:3px solid var(--sky);padding:2px 0 2px 12px}

.crm-sum td{white-space:pre-wrap;overflow-wrap:anywhere;max-width:46ch}.crm-pane{margin-top:14px;border-top:1px solid #2A4350;padding-top:12px}.crm-pane .it{font-size:13.5px;margin:6px 0;color:#DFEAEE}@media(max-width:520px){.crm-f .two{grid-template-columns:1fr}}`;document.head.appendChild(s)};

/* ---- talking to the server (or, in test mode, to this browser) ---- */
const LC={get:()=>LS.get('dfCrmLocal',{A:[],T:[],P:[]}),set:v=>LS.set('dfCrmLocal',v)};
function localCrm(b){const s=LC.get(),now=new Date().toISOString(),mineRec=r=>!r.priv||r.by===ME,res=x=>Promise.resolve(x);
 if(b.a==='crmList')return res({ok:true,full:true,now,activities:s.A.filter(mineRec),tasks:s.T.filter(mineRec),prospects:s.P.filter(p=>ADMIN||p.owner===ME)});
 const arr=b.kind==='activity'?s.A:b.kind==='task'?s.T:b.kind==='prospect'?s.P:null;
 if(b.a==='crmSave'&&arr){const r=b.rec,i=arr.findIndex(x=>x.id===r.id);if(i<0)arr.push({...r,by:ME,owner:b.kind==='prospect'||b.kind==='task'?ME:undefined,created:now,updated:now,la:null,lo:null});else{const o=arr[i];arr[i]={...o,...r,ref:o.ref,priv:o.priv,by:o.by,updated:now}}LC.set(s);return res({ok:true,rec:arr[i<0?arr.length-1:i]})}
 if(b.a==='crmDelete'&&arr){const i=arr.findIndex(x=>x.id===b.id);if(i>=0)arr.splice(i,1);LC.set(s);return res({ok:true})}
 if(b.a==='crmLink'){const p=s.P.find(x=>x.id===b.id);if(!p||!ADMIN)return res({ok:false,error:'Only Johan or Leon can link a prospect.'});[...s.A,...s.T].forEach(r=>{if(r.ref==='p:'+b.id)r.ref=b.ref});p.linked=b.ref;p.status='won';LC.set(s);return res({ok:true})}
 return res({ok:false,error:'Unknown action'})}
const crmCall=b=>LIVE?api({...b,token:LS.get('dfToken','')}):localCrm(b);

/* ---- local copy, queue, sync ---- */
const crmPersist=()=>IDB.set('crm',{tok:CRM.tok,me:ME,A:cA(),T:cT(),P:cP(),since:CRM.since,fullAt:CRM.fullAt,out:CRM.out});
function crmReset(){CRM.ci=new Map();CRM.A=new Map();CRM.T=new Map();CRM.P=new Map();CRM.out=[];CRM.since='';CRM.fullAt=0;CRM.err='';CRM.state=''}
function crmMerge(r){const set=(m,x)=>{if(x.del)m.delete(x.id);else m.set(x.id,x)};if(r.full){CRM.A.clear();CRM.T.clear();CRM.P.clear()}
 (r.activities||[]).forEach(x=>set(CRM.A,x));(r.tasks||[]).forEach(x=>set(CRM.T,x));(r.prospects||[]).forEach(x=>set(CRM.P,x));
 if(r.full)CRM.out.forEach(crmApply)}                                  // changes still waiting to be sent stay visible
function crmApply(it){const now=new Date().toISOString();
 if(it.op==='save'){const m=it.kind==='activity'?CRM.A:it.kind==='task'?CRM.T:CRM.P,o=m.get(it.rec.id)||{};
  m.set(it.rec.id,{...o,...it.rec,by:o.by||ME,owner:o.owner||ME,created:o.created||now,updated:now,pending:1,ref:o.ref||it.rec.ref,priv:o.priv??it.rec.priv??0,la:o.la??null,lo:o.lo??null})}
 else if(it.op==='delete')(it.kind==='activity'?CRM.A:it.kind==='task'?CRM.T:CRM.P).delete(it.id);
 else if(it.op==='link'){const p=CRM.P.get(it.id);if(p){p.linked=it.ref;p.status='won'}[...CRM.A.values(),...CRM.T.values()].forEach(r=>{if(r.ref==='p:'+it.id)r.ref=it.ref})}}
function crmRefresh(){if(mod==='home')return render();if(document.querySelector('dialog[open]'))return;const f=document.activeElement;if(f&&/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)&&f.closest('#mc'))return;
 if(mod==='crm')V2.crm($('#mc'));else if(mod==='brief')crmBriefPaint();else if(mod==='map'){drawMap();if(tab==='cust')side()}}
async function crmBoot0(){if(CRM.forD===D&&CRM.me===ME){if(crmReady()&&Date.now()-CRM.last>12e4)crmSync().catch(()=>{});return}   // already running: just refresh when it is stale
 CRM.forD=D;CRM.me=ME;crmReset();
 if(!D||!D.ref){CRM.state='notready';return}
 D.ref.forEach((r,i)=>{if(r)CRM.ci.set(r,i)});CRM.state='loading';CRM.tok=LIVE?LS.get('dfToken',''):'local';
 const c=await IDB.get('crm');if(CRM.forD!==D)return;
 if(c&&c.tok===CRM.tok&&c.me===ME){(c.A||[]).forEach(x=>CRM.A.set(x.id,x));(c.T||[]).forEach(x=>CRM.T.set(x.id,x));(c.P||[]).forEach(x=>CRM.P.set(x.id,x));CRM.since=c.since||'';CRM.fullAt=c.fullAt||0;CRM.out=c.out||[];CRM.state='ready';crmRefresh()}
 await crmSync()}
const crmBoot=()=>crmBoot0().catch(e=>console.error('CRM',e));
async function crmSync(){if(CRM.busy){CRM.again=true;return}if(CRM.forD!==D||!D.ref)return;CRM.busy=true;CRM.last=Date.now();
 try{while(CRM.out.length){const it=CRM.out[0],body=it.op==='save'?{a:'crmSave',kind:it.kind,rec:it.rec}:it.op==='delete'?{a:'crmDelete',kind:it.kind,id:it.id}:{a:'crmLink',id:it.id,ref:it.ref};
   let r;try{r=await crmCall(body)}catch{CRM.state='offline';crmPersist();return}
   if(r.signin){CRM.state='offline';crmPersist();return}
   CRM.out.shift();
   if(r.ok){if(r.rec){const m=it.kind==='activity'?CRM.A:it.kind==='task'?CRM.T:CRM.P;m.set(r.rec.id,r.rec)}}
   else{toast('Not saved: '+(r.error||'the server refused it'));CRM.since='';CRM.fullAt=0}}
  const full=!CRM.since||Date.now()-CRM.fullAt>12*36e5;let r;
  try{r=await crmCall({a:'crmList',since:full?'':CRM.since})}catch{CRM.state=CRM.state==='ready'?'offline':CRM.state||'offline';crmPersist();crmRefresh();return}
  if(!r.ok){if(r.signin){CRM.state='offline'}else if(r.notReady){CRM.state='notready'}else{CRM.state='error';CRM.err=r.error||''}crmRefresh();return}
  crmMerge(r);CRM.since=r.now;if(r.full)CRM.fullAt=Date.now();CRM.state='ready';crmPersist();crmRefresh()}
 finally{CRM.busy=false;if(CRM.again){CRM.again=false;crmSync().catch(e=>console.error('CRM',e))}}}
function crmSend(it){crmApply(it);CRM.out.push(it);crmPersist();crmRefresh();return crmSync()}
const crmSave=(kind,rec)=>crmSend({op:'save',kind,rec});
const crmDel=(kind,id)=>crmSend({op:'delete',kind,id});

/* a note logged without a connection is sent as soon as the phone is online again or the app is opened again */
addEventListener('online',()=>{if(CRM.forD===D)crmSync().catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CRM.forD===D&&crmReady())crmSync().catch(()=>{})});

  <label>What was said or agreed<textarea id="fS" maxlength="2000" required>${esc(a?a.summary:'')}</textarea></label>
  ${a?`<p class="hint">${a.priv?'This note is private: only you can read it.':'Johan and Leon can read this note.'}</p>`:`<label class="chk"><input type="checkbox" id="fP"> Private: only I can read it (Johan and Leon can not)</label>
  <div class="two"><label>Follow-up on<input type="date" id="fFd" min="${todayISO()}"></label><label>Follow-up task<input id="fFt" maxlength="300" placeholder="Call back about the price"></label></div>`}
  <p class="note" role="alert" style="margin:0"></p><div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn">Save</button></div></form>`,d=>{
  d.querySelector('#fF').onsubmit=e=>{e.preventDefault();const r=tgtPick(d,ref,list);if(!r)return crmErr(d,'Choose a customer or prospect from the list.');
